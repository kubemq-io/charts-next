# License. Kubernetes deployments require a key or signed file. Set exactly ONE of the four sources:
#
#   licenseKey   — the online license key (short string). The server activates it against the
#                  KubeMQ license service and keeps a lease. Becomes pod env KUBEMQ_LICENSE_KEY.
#   licenseFile  — an offline, signed license file: the armored
#                  "-----BEGIN KUBEMQ LICENSE-----" text or a bare compact JWS. The server verifies
#                  the signature locally; no network needed. Becomes pod env KUBEMQ_LICENSE_DATA.
#                  Pass it with `--set-file licenseFile=./kubemq.license`.
#
# To keep the license out of the KubemqCluster object and out of Helm's saved values, put it in an
# existing Secret and reference that Secret instead (name = Secret name, key = data key; the key
# defaults to "licenseKey" / "licenseFile" when omitted):
#   kubectl create secret generic my-kubemq-license --from-file=licenseKey=./license.key
#   kubectl create secret generic my-kubemq-license --from-file=licenseFile=./kubemq.license
#
# The four sources are mutually exclusive — rendering fails when none or more than one is set.
licenseKey:
licenseFile:
# licenseKeySecretRef:
#   name: my-kubemq-license
#   key: licenseKey
# licenseFileSecretRef:
#   name: my-kubemq-license
#   key: licenseFile

# The KubeMQ cluster. When enabled the chart renders one next.kubemq.io/v1 KubemqCluster named
# after the release. Every other top-level value in this file that is not listed under
# "chart-only keys" below is passed through verbatim into the KubemqCluster spec
# (replicas, image, volume, store, grpc, rest, kafka, ...).
#
# The default release owns only the namespace operator and its shared permissions.
# A separate cluster release sets cluster.enabled=true and operator.enabled=false.
# KubemqCluster is retained on uninstall; delete it explicitly with UID preconditions.
cluster:
  enabled: false
  # Optional nonsecret operation identity for recovering an interrupted create.
  installationID: ""

# Initial server count: permanent after the cluster is established. Kubernetes rejects later
# Only operator-managed clusters with at least 3 servers are supported. For a single
# development server, use Docker. standalone=true is rejected.
# replica changes; the operator also holds the established count. Choose before first install.
# The license may cap this initial count. Each server requests its own volume (5Gi by default).
replicas: 3

# Persistent storage for each server node. The next storage engine keeps its data and the cached
# license lease on this volume. Without one, every pod restart starts from an empty store: a rolling
# update of a multi-node cluster restarts each node empty and the cluster may not re-form, and each
# restart needs a fresh license activation. Size it for your retention.
# To run without a volume (throwaway test only): --set volume=null
volume:
  size: 5Gi

# Health / liveness probe. Enabling it also binds the management API to 0.0.0.0 so the
# dashboard is reachable through the Service and `kubectl port-forward`.
health:
  enabled: true

# Install exactly one independently owned operator release per namespace. Cluster
# releases must set enabled=false and reuse that operator and its shared permissions.
operator:
  enabled: true
  image: europe-docker.pkg.dev/kubemq/images/kubemq-operator-next:v3.4.0
  pullPolicy: IfNotPresent
  # Default server image for clusters that do not set image.image. Pinned to a version, not
  # :latest, and bumped together with each operator release: a server release can require
  # something only a newer operator sets on its pods, so the two must move in step.
  serverImage: europe-docker.pkg.dev/kubemq/images/kubemq-next:v3.5.0
  # Default image per connector type, for KubemqConnectors that do not set spec.image. No
  # -next connector image is published yet, so these are empty: set spec.image on every
  # KubemqConnector. A connector with neither fails its reconcile with a clear
  # "no image configured" error instead of a pod stuck pulling an image that does not exist.
  connectorImages:
    targets: ""
    sources: ""
    bridges: ""

imagePullSecrets: []

# chart-only keys (never passed into the KubemqCluster spec):
#   licenseKey, licenseFile, licenseKeySecretRef, licenseFileSecretRef, cluster, operator, preDelete,
#   imagePullSecrets, nameOverride, fullnameOverride
