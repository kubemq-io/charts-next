{{- if .Values.operator.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubemq-operator-next
  namespace: {{ .Release.Namespace }}
---
{{- /* The server's identity (ServiceAccount kubemq-cluster-next, its Role/RoleBinding and the
     license ClusterRole/ClusterRoleBinding) is one per namespace: the operator hard-codes that
     ServiceAccount name on every server pod it builds. It is rendered by the release that
     installs this namespace's operator. A second release in the same namespace with
     operator.enabled=false reuses it; rendering it again would make that install fail on
     objects owned by the first release. */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubemq-cluster-next
  namespace: {{ .Release.Namespace }}
{{- end }}
