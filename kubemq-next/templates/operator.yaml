{{- if .Values.operator.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubemq-operator-next
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubemq-operator-next
  template:
    metadata:
      labels:
        app: kubemq-operator-next
    spec:
      serviceAccountName: kubemq-operator-next
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # The operator image runs as the distroless nonroot user (65532); the restricted
      # profile below is what OpenShift and the restricted Pod Security Standard require.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kubemq-operator
          image: {{ .Values.operator.image }}
          command:
            - kubemq-operator
          imagePullPolicy: {{ .Values.operator.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
          env:
            - name: WATCH_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: RELATED_IMAGE_KUBEMQ_CLUSTER
              value: {{ .Values.operator.serverImage | quote }}
            {{- /* Only set ones are passed: with none, the operator requires spec.image on the connector. */}}
            {{- with .Values.operator.connectorImages }}
            {{- with .targets }}
            - name: CONNECTOR_TARGETS_IMAGE
              value: {{ . | quote }}
            {{- end }}
            {{- with .sources }}
            - name: CONNECTOR_SOURCES_IMAGE
              value: {{ . | quote }}
            {{- end }}
            {{- with .bridges }}
            - name: CONNECTOR_BRIDGES_IMAGE
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
{{- end }}
