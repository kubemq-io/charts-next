{{- if .Values.operator.enabled }}
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "kubemq.crbName" . }}
subjects:
  - kind: ServiceAccount
    name: kubemq-operator-next
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "kubemq.operatorRoleName" . }}
  apiGroup: rbac.authorization.k8s.io
---
{{- /* Server Role/RoleBinding: rendered with the server ServiceAccount (see service_account.yaml). */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubemq-cluster-next-role
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups:
      - security.openshift.io
    resources:
      - securitycontextconstraints
    verbs:
      - use
      - delete
      - get
      - list
      - patch
      - update
      - watch
    resourceNames:
      - privileged
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: kubemq-cluster-next-rb
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: kubemq-cluster-next
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: kubemq-cluster-next-role
  apiGroup: rbac.authorization.k8s.io
{{- end }}
