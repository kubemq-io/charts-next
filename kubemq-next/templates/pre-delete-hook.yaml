{{- if and .Values.preDelete.enabled .Values.cluster.enabled }}
# Pre-delete hook: delete the KubemqCluster while the operator is still running,
# so the operator drains its finalizer, BEFORE Helm tears the operator down. Without this,
# `helm uninstall` deadlocks on the CR finalizer.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kubemq.fullname" . }}-predelete
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kubemq.fullname" . }}-predelete
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  - apiGroups: ["next.kubemq.io"]
    resources: ["kubemqclusters"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kubemq.fullname" . }}-predelete
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
subjects:
  - kind: ServiceAccount
    name: {{ include "kubemq.fullname" . }}-predelete
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "kubemq.fullname" . }}-predelete
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "kubemq.fullname" . }}-predelete
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 180
  template:
    metadata:
      name: {{ include "kubemq.fullname" . }}-predelete
    spec:
      serviceAccountName: {{ include "kubemq.fullname" . }}-predelete
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: predelete
          image: {{ .Values.preDelete.image }}
          # The official kubectl image has no shell, so the command is exec'd directly.
          command:
            - kubectl
            - delete
            - kubemqclusters.next.kubemq.io
            - {{ include "kubemq.fullname" . }}
            - -n
            - {{ .Release.Namespace }}
            - --ignore-not-found
            - --timeout=120s
{{- end }}
